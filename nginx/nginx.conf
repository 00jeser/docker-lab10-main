# least_conn убран — он не даёт строгого чередования при равной нагрузке. Round-robin по умолчанию
upstream loadbalancer {
    # Порт 81 не совпадал с Flask (8080); непривилегированный user www не биндит <1024
    # max_fails=0 — не выкидывать бэкенд из пула, если он ещё поднимался при старте nginx
    server app1:8080 max_fails=0;
    server app2:8080 max_fails=0;
}

server {
    listen              443 ssl;
    # Задание открывает https://localhost
    server_name         localhost www.example.com;

    # Относительные пути и отсутствующие COPY ломали старт
    ssl_certificate     /etc/nginx/ssl/localhost.crt;
    ssl_certificate_key /etc/nginx/ssl/localhost.key;
    # TLSv1/1.1 + старый ssl_ciphers на OpenSSL 3 в nginx:alpine часто не дают nginx стартовать.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        # Было неверное название блока
        proxy_pass http://loadbalancer;
    }
}
