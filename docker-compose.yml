version: '3'
services:
  app1:
    build: ./app1
    volumes:
      # Общий HTML-шаблон монтируется в /storage 
      - ./storage:/storage:ro
    # depends_on без healthcheck стартует nginx до готовности Flask
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/')"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  app2:
    build: ./app2
    volumes:
      - ./storage:/storage:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/')"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  nginx:
    build: ./nginx
    ports:
      # Было 445:445 — браузер ходит на https: (443), а nginx слушает 443 внутри.
      - "443:443"
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
